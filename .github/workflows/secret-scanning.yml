name: Secret Scanning (TruffleHog)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Wöchentliche Vollscan am Montag
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  trufflehog:
    name: Scan for secrets
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history – damit TruffleHog auch alte Commits prüfen kann
          fetch-depth: 0

      - name: 🔐 TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # Bei PR: Nur den Diff scannen, sonst kompletter Branch
          base: ${{ github.event.pull_request.base.sha || '' }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --results=verified,unknown
