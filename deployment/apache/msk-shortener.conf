# ============================================================================
# MSK Shortener – Apache2 Reverse-Proxy Configuration (Referenz)
#
# Diese Datei dient nur als Referenz/Vorlage. Die tatsächlich aktive
# Konfiguration wird durch install.sh direkt unter
# /etc/apache2/sites-available/msk-shortener.conf erzeugt
# (mit der vom Nutzer angegebenen Domain).
#
# Nach SSL-Aktivierung via 'sudo certbot --apache' wird diese Datei
# automatisch um den HTTPS-VHost und eine HTTP→HTTPS-Weiterleitung
# erweitert.
# ============================================================================

<VirtualHost *:80>
    ServerName {{DOMAIN}}
    ServerAdmin webmaster@{{DOMAIN}}

    # ─── Reverse-Proxy zu Next.js (Port 3001) ──────────────────────
    ProxyPreserveHost   On
    ProxyRequests       Off
    ProxyTimeout        60

    ProxyPass        / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/

    # ─── Korrekte Headers für Client-IP & Protokoll ────────────────
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Host  "%{HTTP_HOST}e"
    RequestHeader set X-Real-IP         "%{REMOTE_ADDR}s"

    # ─── Gzip-Kompression ──────────────────────────────────────────
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript
        AddOutputFilterByType DEFLATE application/javascript application/json
        AddOutputFilterByType DEFLATE image/svg+xml
    </IfModule>

    # ─── Logs ──────────────────────────────────────────────────────
    ErrorLog  ${APACHE_LOG_DIR}/msk-shortener-error.log
    CustomLog ${APACHE_LOG_DIR}/msk-shortener-access.log combined

    LogLevel warn
</VirtualHost>
